# Réglages FIXES d'une caisse kiosque (fournis par le paquet storepos-kiosk-glpi, ne pas modifier).
# L'adresse du serveur et les identifiants sont dans 50-storepos-kiosk-serveur.cfg, écrit par storepos-kiosk-glpi-enroll.

# Aucun port ouvert sur la caisse : on désactive l'interface web de l'agent (port 62354 par défaut).
# L'inventaire est toujours envoyé PAR la caisse, jamais demandé depuis l'extérieur.
no-httpd = 1
