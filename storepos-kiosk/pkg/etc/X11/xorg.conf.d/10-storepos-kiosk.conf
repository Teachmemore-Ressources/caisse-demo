# Kiosque : pas de changement de console (Ctrl+Alt+F1..F12), pas de Ctrl+Alt+Retour arrière,
# pas de veille écran. L'administration se fait par SSH (compte admincaisse).
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
